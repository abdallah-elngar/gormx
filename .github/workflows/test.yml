name: Test Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # كل يوم أحد الساعة 3 صباحاً
    - cron: '0 3 * * 0'

jobs:
  test:
    name: Test Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23']
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # استبعاد بعض التركيبات لتقليل الوقت
          - go: '1.23'
            os: macos-latest
          - go: '1.23'
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -count=1 ./...

      - name: Run tests (short mode)
        run: go test -short -count=1 ./...

      - name: Run tests (with timeout)
        run: go test -timeout=5m -count=1 ./...

  test-32bit:
    name: Test 32-bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test 386
        env:
          GOARCH: 386
        run: go test ./...

  test-pure-go:
    name: Test with CGO disabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test pure Go
        env:
          CGO_ENABLED: 0
        run: go test ./...